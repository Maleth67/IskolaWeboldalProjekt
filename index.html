<script>
    // Képforgó logika
    const slides = document.querySelectorAll('.carousel-slide');
    let currentIndex = 0;

    function nextSlide() {
        slides[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add('active');
    }

    setInterval(nextSlide, 3000);

    // Előre megadott elemek a szerencsekerékhez
    const presetItems = [
        "Ajándék andris szendvics",  
        "Szerencsenap (Nincs házi!)", 
        "Tesztírás holnap", 
        "Szamonkeres a 6/b -ben"
    ];

    function spinWheel() {
        const resultDiv = document.getElementById('wheelResult');
        let counter = 0;
        resultDiv.innerText = "Pörög a kerék... ";
        
        let interval = setInterval(() => {
            let randomIndex = Math.floor(Math.random() * presetItems.length);
            resultDiv.innerText = presetItems[randomIndex];
            counter++;
            if (counter > 15) {
                clearInterval(interval);
                let finalIndex = Math.floor(Math.random() * presetItems.length);
                resultDiv.innerText = " Eredmény: " + presetItems[finalIndex];
            }
        }, 100);
    }
</script>
